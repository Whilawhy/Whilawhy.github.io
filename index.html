<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Study Checklist</title>
<style>
  :root{
    --bg: #0d1013;
    --surface: #14181d;
    --surface-2: #191e24;
    --border: #262c34;
    --border-soft: #1e242b;
    --text: #e8eaed;
    --text-dim: #9aa2ad;
    --text-faint: #5d6570;
    --accent: #6fae8b;       /* calm sage green - progress / active */
    --accent-soft: rgba(111,174,139,0.14);
    --done: #4c8f70;
    --done-soft: rgba(76,143,112,0.12);
    --exam: #d98a3d;         /* warm amber for exam days */
    --exam-soft: rgba(217,138,61,0.13);
    --rest: #6b7480;
    --radius: 14px;
    --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    overscroll-behavior-y: none;
  }

  #app{
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Sticky header ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(13,16,19,0.92);
    backdrop-filter: saturate(150%) blur(14px);
    -webkit-backdrop-filter: saturate(150%) blur(14px);
    padding: calc(var(--safe-top) + 12px) 16px 12px 16px;
    border-bottom: 1px solid var(--border-soft);
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
  }

  .nav-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .nav-btn:active{ background: var(--border); }

  .date-block{
    flex: 1;
    text-align:center;
    min-width: 0;
  }
  .date-block .month-day{
    font-size: 19px;
    font-weight: 650;
    letter-spacing: 0.2px;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .date-block .dow{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .icon-btn{
    background: transparent;
    border: none;
    color: var(--text-dim);
    width: 40px; height: 40px;
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    flex-shrink:0;
  }
  .icon-btn:active{ background: var(--surface-2); }

  .today-row{
    display:flex;
    justify-content:center;
    margin-top: 10px;
  }
  .today-pill{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .today-pill:active{ background: var(--accent-soft); }
  .today-pill[disabled]{ opacity: 0.35; }

  /* ---------- Exam banner ---------- */
  .exam-banner{
    margin-top: 12px;
    background: var(--exam-soft);
    border: 1px solid rgba(217,138,61,0.35);
    color: var(--exam);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .exam-banner .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--exam);
    flex-shrink:0;
  }

  .day-note{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-faint);
    text-align:center;
  }

  /* ---------- Progress ---------- */
  .progress-wrap{
    margin-top: 12px;
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .progress-track{
    height: 7px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow:hidden;
    border: 1px solid var(--border-soft);
  }
  .progress-fill{
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .overall-line{
    margin-top: 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .overall-line .streak{
    display:flex;
    align-items:center;
    gap: 4px;
  }

  /* ---------- Task list ---------- */
  main{
    flex: 1;
    padding: 14px 14px calc(100px + var(--safe-bottom)) 14px;
  }

  .task-card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    display:flex;
    align-items:flex-start;
    gap: 12px;
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .task-card.done{
    background: var(--done-soft);
    border-color: rgba(76,143,112,0.28);
  }
  .task-card.exam-task{
    border-color: rgba(217,138,61,0.35);
    background: var(--exam-soft);
  }

  .checkbox{
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid var(--text-faint);
    flex-shrink: 0;
    margin-top: 2px;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.18s ease;
  }
  .task-card.done .checkbox{
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox svg{
    width: 15px; height: 15px;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.18s ease;
  }
  .task-card.done .checkbox svg{
    opacity: 1;
    transform: scale(1);
  }

  .task-body{
    flex: 1;
    min-width: 0;
  }
  .task-top{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .session-num{
    font-size: 11px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .tag{
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .tag.P1{ color:#8fb8e0; border-color: rgba(143,184,224,0.35); background: rgba(143,184,224,0.1); }
  .tag.P2{ color:#8fd0c6; border-color: rgba(143,208,198,0.35); background: rgba(143,208,198,0.1); }
  .tag.M1{ color:#c9a6e0; border-color: rgba(201,166,224,0.35); background: rgba(201,166,224,0.1); }
  .tag.U1{ color:#e0b98f; border-color: rgba(224,185,143,0.35); background: rgba(224,185,143,0.1); }
  .tag.U2{ color:#e0938f; border-color: rgba(224,147,143,0.35); background: rgba(224,147,143,0.1); }
  .tag.U3{ color:#e0d08f; border-color: rgba(224,208,143,0.35); background: rgba(224,208,143,0.1); }
  .tag.EXAM{ color: var(--exam); border-color: rgba(217,138,61,0.4); background: rgba(217,138,61,0.14); }
  .tag.REST{ color: var(--rest); border-color: rgba(107,116,128,0.4); background: rgba(107,116,128,0.12); }

  .task-text{
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
  }
  .task-card.done .task-text{
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
    text-decoration-thickness: 1px;
  }

  /* ---------- Bottom bar ---------- */
  .bottombar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display:flex;
    justify-content:center;
  }
  .bottombar-inner{
    width: 100%;
    max-width: 560px;
    background: rgba(13,16,19,0.92);
    backdrop-filter: saturate(150%) blur(14px);
    -webkit-backdrop-filter: saturate(150%) blur(14px);
    border-top: 1px solid var(--border-soft);
    padding: 10px 16px calc(10px + var(--safe-bottom)) 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .bb-btn{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 12px;
    text-align:center;
  }
  .bb-btn:active{ background: var(--border); }
  .bb-btn.primary{
    color: var(--accent);
  }

  /* ---------- Settings sheet ---------- */
  .sheet-overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.55);
    z-index: 30;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position: fixed;
    left:0; right:0; bottom:0;
    z-index: 31;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 10px 20px calc(24px + var(--safe-bottom)) 20px;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    max-width: 560px;
    margin: 0 auto;
    max-height: 78vh;
    overflow-y: auto;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 999px;
    margin: 6px auto 16px auto;
  }
  .sheet h2{
    font-size: 16px;
    margin: 0 0 12px 0;
  }
  .sheet-section{
    margin-bottom: 22px;
  }
  .sheet-label{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .sheet input[type="date"]{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 12px;
    font-size: 15px;
    color-scheme: dark;
  }
  .sheet-stats{
    display:flex;
    gap: 10px;
  }
  .stat-box{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 12px;
    text-align:center;
  }
  .stat-box .num{
    font-size: 20px;
    font-weight: 700;
  }
  .stat-box .lbl{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .danger-btn{
    width:100%;
    background: rgba(217,90,90,0.1);
    border: 1px solid rgba(217,90,90,0.35);
    color: #e07a7a;
    padding: 13px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 600;
  }
  .danger-btn:active{ background: rgba(217,90,90,0.2); }

  .confirm-box{
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    display:none;
    gap: 8px;
  }
  .confirm-box.show{ display:flex; }
  .confirm-box button{
    flex:1;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .confirm-box button.yes{
    background: rgba(217,90,90,0.15);
    border-color: rgba(217,90,90,0.4);
    color: #e07a7a;
  }

  .close-sheet{
    margin-top: 4px;
    width: 100%;
    text-align:center;
    padding: 12px;
    color: var(--text-dim);
    font-size: 14px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div id="app">

  <header>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous day">‹</button>
      <div class="date-block">
        <div class="month-day" id="monthDay">—</div>
        <div class="dow" id="dowLabel">—</div>
      </div>
      <button class="nav-btn" id="nextBtn" aria-label="Next day">›</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </div>

    <div class="today-row">
      <button class="today-pill" id="todayBtn">Today</button>
    </div>

    <div id="examBannerWrap"></div>
    <div id="dayNoteWrap"></div>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span id="progressLabel">Progress</span>
        <span id="progressFrac">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="overall-line">
        <span id="overallLabel">Overall 0 / 0 · 0%</span>
        <span class="streak" id="streakLabel"></span>
      </div>
    </div>
  </header>

  <main id="taskList"></main>

  <div class="bottombar">
    <div class="bottombar-inner">
      <button class="bb-btn" id="prevBtn2">← Previous</button>
      <button class="bb-btn primary" id="jumpBtn">Jump to date</button>
      <button class="bb-btn" id="nextBtn2">Next →</button>
    </div>
  </div>

</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>Settings</h2>

  <div class="sheet-section">
    <div class="sheet-label">Jump to a date</div>
    <input type="date" id="datePicker">
  </div>

  <div class="sheet-section">
    <div class="sheet-label">Overall progress</div>
    <div class="sheet-stats">
      <div class="stat-box">
        <div class="num" id="statDone">0</div>
        <div class="lbl">Completed</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Total sessions</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statPct">0%</div>
        <div class="lbl">Overall</div>
      </div>
    </div>
  </div>

  <div class="sheet-section">
    <div class="sheet-label">Reset</div>
    <button class="danger-btn" id="resetBtn">Reset Progress</button>
    <div class="confirm-box" id="confirmBox">
      <button id="confirmCancel">Cancel</button>
      <button class="yes" id="confirmYes">Yes, reset everything</button>
    </div>
  </div>

  <div class="close-sheet" id="closeSheet">Close</div>
</div>

"}, {"s": "9", "tag": "U3", "text": "Mark + correct U3 June 2024"}, {"s": "10", "tag": "U3", "text": "Redo every wrong question from U3 Oct 2024 + Jun 2024"}]}, {"date": "2026-10-17", "dow": "Saturday", "exam": null, "note": null, "tasks": [{"s": "1–2", "tag": "U3", "text": "U3 October 2023 WPH13/01"}, {"s": "3", "tag": "U3", "text": "Mark + correct U3 October 2023"}, {"s": "4–5", "tag": "U3", "text": "U3 June 2023 WPH13/01"}, {"s": "6", "tag": "U3", "text": "Mark + correct U3 June 2023"}, {"s": "7–8", "tag": "U3", "text": "U3 October 2022 WPH13/01"}, {"s": "9", "tag": "U3", "text": "Mark + correct U3 October 2022"}, {"s": "10", "tag": "U3", "text": "Redo every wrong question from U3 Oct 2023 + Jun 2023"}]}, {"date": "2026-10-18", "dow": "Sunday", "exam": null, "note": "Final U3 day", "tasks": [{"s": "1–2", "tag": "U3", "text": "U3 June 2022 WPH13/01"}, {"s": "3", "tag": "U3", "text": "Mark + correct U3 June 2022"}, {"s": "4–5", "tag": "U3", "text": "U3 January 2026 WPH13/01"}, {"s": "6", "tag": "U3", "text": "Mark + correct U3 January 2026"}, {"s": "7", "tag": "U3", "text": "Redo every wrong U3 question from Oct 2025"}, {"s": "8", "tag": "U3", "text": "Redo every wrong U3 question from Jun 2025"}, {"s": "9", "tag": "U3", "text": "Redo every wrong U3 question from Jan 2025"}, {"s": "10", "tag": "U3", "text": "Redo every wrong U3 question from Jan 2026"}]}, {"date": "2026-10-19", "dow": "Monday", "exam": "PHYSICS U3 EXAM", "note": null, "tasks": [{"s": "1", "tag": "EXAM", "text": "Physics U3 exam"}]}];

  const RANGE_START = TIMETABLE[0].date;
  const RANGE_END = TIMETABLE[TIMETABLE.length - 1].date;
  const STORAGE_KEY = "studyChecklist_v1";

  /* ---------------- state ---------------- */
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable - fail silently */ }
  }
  let state = loadState(); // { "2026-09-16": { "1": true, "2": false, ... } }

  function isChecked(date, s){
    return !!(state[date] && state[date][s]);
  }
  function setChecked(date, s, val){
    if(!state[date]) state[date] = {};
    state[date][s] = val;
    saveState(state);
  }

  /* ---------------- date helpers ---------------- */
  function toISODate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function dayIndex(dateStr){
    return TIMETABLE.findIndex(d => d.date === dateStr);
  }

  const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  function formatMonthDay(dateStr){
    const [y,m,d] = dateStr.split("-").map(Number);
    return MONTHS[m-1] + " " + d;
  }

  function todayInRangeOrStart(){
    const now = new Date();
    const todayStr = toISODate(now);
    if(todayStr >= RANGE_START && todayStr <= RANGE_END){
      return todayStr;
    }
    return RANGE_START;
  }

  /* ---------------- current day ---------------- */
  let currentIdx = dayIndex(todayInRangeOrStart());
  if(currentIdx < 0) currentIdx = 0;

  /* ---------------- rendering ---------------- */
  const monthDayEl = document.getElementById("monthDay");
  const dowEl = document.getElementById("dowLabel");
  const examBannerWrap = document.getElementById("examBannerWrap");
  const dayNoteWrap = document.getElementById("dayNoteWrap");
  const progressFrac = document.getElementById("progressFrac");
  const progressFill = document.getElementById("progressFill");
  const overallLabel = document.getElementById("overallLabel");
  const streakLabel = document.getElementById("streakLabel");
  const taskList = document.getElementById("taskList");
  const todayBtn = document.getElementById("todayBtn");

  function checkSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#0d1013" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"></polyline></svg>';
  }

  function renderDay(){
    const day = TIMETABLE[currentIdx];

    monthDayEl.textContent = formatMonthDay(day.date);
    dowEl.textContent = day.dow;

    // exam banner
    if(day.exam){
      examBannerWrap.innerHTML =
        '<div class="exam-banner"><span class="dot"></span>' + day.exam + '</div>';
    } else {
      examBannerWrap.innerHTML = "";
    }

    // note
    if(day.note){
      dayNoteWrap.innerHTML = '<div class="day-note">' + day.note + '</div>';
    } else {
      dayNoteWrap.innerHTML = "";
    }

    // today pill enabled state
    const isToday = toISODate(new Date()) === day.date;
    todayBtn.disabled = isToday;

    // task list
    taskList.innerHTML = "";
    day.tasks.forEach(function(task){
      const done = isChecked(day.date, task.s);
      const card = document.createElement("div");
      card.className = "task-card" + (done ? " done" : "") + (task.tag === "EXAM" ? " exam-task" : "");
      card.innerHTML =
        '<div class="checkbox">' + checkSvg() + '</div>' +
        '<div class="task-body">' +
          '<div class="task-top">' +
            '<span class="session-num">S' + task.s + '</span>' +
            '<span class="tag ' + task.tag + '">' + task.tag + '</span>' +
          '</div>' +
          '<div class="task-text">' + escapeHtml(task.text) + '</div>' +
        '</div>';
      card.addEventListener("click", function(){
        const newVal = !isChecked(day.date, task.s);
        setChecked(day.date, task.s, newVal);
        renderDay();
        renderOverall();
      });
      taskList.appendChild(card);
    });

    renderDayProgress();
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderDayProgress(){
    const day = TIMETABLE[currentIdx];
    const total = day.tasks.length;
    let done = 0;
    day.tasks.forEach(function(t){ if(isChecked(day.date, t.s)) done++; });
    progressFrac.textContent = done + " / " + total;
    progressFill.style.width = (total ? (done/total*100) : 0) + "%";
  }

  function computeStreak(){
    // Streak = consecutive fully-completed days, counting backward
    // from the most recent day (at or before today, within range)
    // that has at least one completed session.
    const todayStr = toISODate(new Date());
    let anchorIdx = -1;
    for(let i = TIMETABLE.length - 1; i >= 0; i--){
      if(TIMETABLE[i].date > todayStr) continue;
      const d = TIMETABLE[i];
      const anyDone = d.tasks.some(t => isChecked(d.date, t.s));
      if(anyDone){ anchorIdx = i; break; }
    }
    if(anchorIdx === -1) return 0;

    let streak = 0;
    for(let i = anchorIdx; i >= 0; i--){
      const d = TIMETABLE[i];
      const allDone = d.tasks.every(t => isChecked(d.date, t.s));
      if(allDone){ streak++; } else { break; }
    }
    return streak;
  }

  function renderOverall(){
    let totalTasks = 0, totalDone = 0;
    TIMETABLE.forEach(function(day){
      totalTasks += day.tasks.length;
      day.tasks.forEach(function(t){ if(isChecked(day.date, t.s)) totalDone++; });
    });
    const pct = totalTasks ? Math.round(totalDone/totalTasks*100) : 0;
    overallLabel.textContent = "Overall " + totalDone + " / " + totalTasks + " \u00B7 " + pct + "%";

    const streak = computeStreak();
    streakLabel.textContent = streak > 0 ? ("\uD83D\uDD25 " + streak) : "";

    document.getElementById("statDone").textContent = totalDone;
    document.getElementById("statTotal").textContent = totalTasks;
    document.getElementById("statPct").textContent = pct + "%";
  }

  /* ---------------- navigation ---------------- */
  function goTo(idx){
    if(idx < 0 || idx >= TIMETABLE.length) return;
    currentIdx = idx;
    renderDay();
  }
  function goPrev(){ goTo(currentIdx - 1); }
  function goNext(){ goTo(currentIdx + 1); }
  function goToday(){ goTo(dayIndex(todayInRangeOrStart())); }

  document.getElementById("prevBtn").addEventListener("click", goPrev);
  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("prevBtn2").addEventListener("click", goPrev);
  document.getElementById("nextBtn2").addEventListener("click", goNext);
  todayBtn.addEventListener("click", goToday);

  /* ---------------- settings sheet ---------------- */
  const sheet = document.getElementById("sheet");
  const sheetOverlay = document.getElementById("sheetOverlay");
  const datePicker = document.getElementById("datePicker");
  datePicker.min = RANGE_START;
  datePicker.max = RANGE_END;

  function openSheet(){
    datePicker.value = TIMETABLE[currentIdx].date;
    hideConfirm();
    sheet.classList.add("open");
    sheetOverlay.classList.add("open");
  }
  function closeSheetFn(){
    sheet.classList.remove("open");
    sheetOverlay.classList.remove("open");
  }
  document.getElementById("settingsBtn").addEventListener("click", openSheet);
  document.getElementById("jumpBtn").addEventListener("click", openSheet);
  document.getElementById("closeSheet").addEventListener("click", closeSheetFn);
  sheetOverlay.addEventListener("click", closeSheetFn);

  datePicker.addEventListener("change", function(){
    const idx = dayIndex(datePicker.value);
    if(idx >= 0){
      goTo(idx);
      closeSheetFn();
    }
  });

  /* ---------------- reset ---------------- */
  const confirmBox = document.getElementById("confirmBox");
  function hideConfirm(){ confirmBox.classList.remove("show"); }
  document.getElementById("resetBtn").addEventListener("click", function(){
    confirmBox.classList.add("show");
  });
  document.getElementById("confirmCancel").addEventListener("click", hideConfirm);
  document.getElementById("confirmYes").addEventListener("click", function(){
    state = {};
    saveState(state);
    hideConfirm();
    closeSheetFn();
    renderDay();
    renderOverall();
  });

  /* ---------------- init ---------------- */
  renderDay();
  renderOverall();

})();
</script>
