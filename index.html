<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Countdown</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#14171b;
    --panel-2:#191d22;
    --line:#262b31;
    --ink:#e9edf1;
    --ink-dim:#8b95a1;
    --ink-faint:#5a636e;
    --accent:#5fb8a8;
    --accent-dim:#2c3f3c;
    --paper:#c9a96e;
    --paper-dim:#3a3226;
    --exam:#d4685a;
    --exam-dim:#3a2420;
    --rest:#7a8fb0;
    --rest-dim:#232a36;
    --done:#4a5158;
    --radius:14px;
    --c-P1:#f2b134;
    --c-P2:#ef8354;
    --c-M1:#5aa9e6;
    --c-U1:#a78bfa;
    --c-U2:#4fd1c5;
    --c-U3:#f472b6;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{overflow-x:hidden;}

  #app{max-width:640px;margin:0 auto;padding:0 16px 40px;}

  header.top{
    position:sticky;top:0;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-bottom:10px;
    background:linear-gradient(var(--bg) 82%, transparent);
    z-index:20;
  }
  .brand{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;
  }
  .brand h1{
    font-size:1.05rem;font-weight:650;letter-spacing:.01em;margin:0;color:var(--ink);
  }
  .streak{
    display:flex;align-items:center;gap:6px;
    font-size:.82rem;color:var(--ink-dim);font-weight:500;
  }
  .streak b{color:var(--accent);font-weight:700;}

  .overall-bar{height:5px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin-bottom:16px;}
  .overall-bar > div{height:100%;background:var(--accent);border-radius:4px;transition:width .35s ease;}

  .nav-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .nav-btn{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    width:40px;height:40px;border-radius:11px;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-btn:active{background:var(--panel-2);}
  .nav-btn:disabled{opacity:.3;}
  .date-block{flex:1 1 auto;min-width:0;text-align:center;}
  .date-block .day-label{
    font-size:1.15rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .date-block .day-sub{font-size:.78rem;color:var(--ink-dim);margin-top:1px;}

  .quick-row{display:flex;gap:8px;margin-bottom:14px;}
  .quick-btn{
    flex:1;padding:9px 6px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);color:var(--ink-dim);font-size:.78rem;font-weight:600;
    -webkit-tap-highlight-color:transparent;
  }
  .quick-btn:active{background:var(--panel-2);}

  .day-progress{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;
  }
  .day-progress .count{font-size:.95rem;font-weight:700;}
  .day-progress .count span{color:var(--accent);}
  .day-progress .mini-bar{flex:1;height:6px;margin:0 14px;border-radius:4px;background:var(--panel-2);overflow:hidden;}
  .day-progress .mini-bar > div{height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease;}

  .exam-banner{
    background:linear-gradient(135deg,var(--exam-dim),#241614);
    border:1px solid #5a332c;border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .exam-banner .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--exam);}
  .exam-banner .title{font-size:1.15rem;font-weight:750;margin-top:4px;}
  .exam-banner .code{font-size:.85rem;color:var(--ink-dim);margin-top:2px;}

  .filters{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);color:var(--ink-dim);font-size:.8rem;font-weight:600;
    white-space:nowrap;-webkit-tap-highlight-color:transparent;
  }
  .chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  .subject-row{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .subject-row::-webkit-scrollbar{display:none;}
  .schip{
    flex:0 0 auto;padding:6px 12px;border-radius:9px;background:transparent;
    border:1px solid var(--line);color:var(--ink-faint);font-size:.76rem;font-weight:700;
    letter-spacing:.02em;-webkit-tap-highlight-color:transparent;
  }
  .schip.active{background:var(--panel-2);color:var(--ink);border-color:#3a4046;}
  .schip[data-active-color]{color:var(--chip-c);border-color:var(--chip-c);background:var(--chip-c-dim);}

  .task-list{display:flex;flex-direction:column;gap:9px;}

  .task{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    border-left:3px solid var(--line);
    padding:13px 14px;
    -webkit-tap-highlight-color:transparent;
    transition:box-shadow .25s ease, background .25s ease, opacity .25s ease;
  }
  .task.done{opacity:.72;}

  .box{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;
    border:2px solid #454c54;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
  }
  .task.done .box{background:var(--accent);border-color:var(--accent);}
  .box svg{width:15px;height:15px;display:none;}
  .task.done .box svg{display:block;}

  .task-body{flex:1;min-width:0;}
  .task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
  .subj-tag{
    font-size:.68rem;font-weight:800;letter-spacing:.03em;
    border-radius:6px;padding:2px 7px;
  }
  .sess-num{font-size:.7rem;color:var(--ink-faint);font-weight:600;}
  .type-tag{
    font-size:.66rem;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:2px 7px;
  }
  .type-tag.full{color:var(--paper);background:var(--paper-dim);}
  .type-tag.mark{color:var(--paper);background:var(--paper-dim);}
  .type-tag.normal{color:var(--ink-dim);background:transparent;}
  .type-tag.rest{color:var(--rest);background:var(--rest-dim);}

  .task-text{font-size:.94rem;line-height:1.35;font-weight:500;}
  .task.done .task-text{text-decoration:line-through;color:var(--ink-faint);}
  .task-detail{font-size:.81rem;line-height:1.35;color:var(--ink-dim);margin-top:4px;}
  .task.done .task-detail{color:var(--ink-faint);}

  .empty{
    text-align:center;color:var(--ink-faint);padding:40px 10px;font-size:.9rem;
  }

  footer.bottom{
    margin-top:22px;display:flex;justify-content:center;
  }
  .reset-btn{
    background:transparent;border:1px solid var(--line);color:var(--ink-faint);
    font-size:.78rem;font-weight:600;padding:10px 18px;border-radius:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .reset-btn:active{background:var(--panel);}

  @media (min-width:600px){
    :root{font-size:16.5px;}
    #app{padding:0 24px 48px;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>Exam Countdown</h1>
      <div class="streak">🔥 <b id="streakNum">0</b><span>&nbsp;day streak</span></div>
    </div>
    <div class="overall-bar"><div id="overallFill" style="width:0%"></div></div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" aria-label="Previous day">‹</button>
      <div class="date-block">
        <div class="day-label" id="dayLabel">—</div>
        <div class="day-sub" id="daySub">—</div>
      </div>
      <button class="nav-btn" id="nextBtn" aria-label="Next day">›</button>
    </div>

    <div class="quick-row">
      <button class="quick-btn" id="todayBtn">Today</button>
      <button class="quick-btn" id="nextUnfinishedBtn">Next unfinished</button>
    </div>
  </header>

  <div class="day-progress">
    <div class="count" id="dayCount">0 / 0</div>
    <div class="mini-bar"><div id="dayFill" style="width:0%"></div></div>
  </div>

  <div id="examBannerHolder"></div>

  <div class="filters" id="statusFilters">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="unfinished">Unfinished</button>
    <button class="chip" data-f="completed">Completed</button>
  </div>

  <div class="subject-row" id="subjectFilters">
    <button class="schip active" data-s="all">All</button>
    <button class="schip" data-s="P1">P1</button>
    <button class="schip" data-s="P2">P2</button>
    <button class="schip" data-s="M1">M1</button>
    <button class="schip" data-s="U1">U1</button>
    <button class="schip" data-s="U2">U2</button>
    <button class="schip" data-s="U3">U3</button>
  </div>

  <div class="task-list" id="taskList"></div>

  <footer class="bottom">
    <button class="reset-btn" id="resetBtn">Reset all progress</button>
  </footer>
</div>

function getDetail(text){
  for(var i=0;i<DETAIL_RULES.length;i++){
    if(DETAIL_RULES[i][0].test(text)) return DETAIL_RULES[i][1];
  }
  return null;
}

/* ---------- BUILD MODEL ---------- */
function classify(subject, text){
  if(subject === "GEN") return "rest";
  if(/EXAM\s—/.test(text)) return "exam";
  if(text.includes("Full Paper")) return "full";
  if(text.includes("Mark + Correct")) return "mark";
  return "normal";
}

const DAYS = RAW_DAYS.map(function(d){
  var id=d[0], label=d[1], year=d[2], month=d[3], date=d[4], raw=d[5];
  var tasks = raw.map(function(t,i){
    var subject=t[0], text=t[1];
    var type = classify(subject, text);
    return {idx:i, subject:subject, text:text, type:type};
  });
  var hasExam = tasks.some(function(t){return t.type==="exam";});
  return {id:id, label:label, year:year, month:month, date:date, tasks:tasks, hasExam:hasExam};
});

/* ---------- STATE ---------- */
var STORE_KEY = "studyplan_v1_done";
var doneMap = {};
try{
  var stored = localStorage.getItem(STORE_KEY);
  if(stored) doneMap = JSON.parse(stored);
}catch(e){ doneMap = {}; }

function saveDone(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(doneMap)); }catch(e){}
}
function taskKey(dayId, idx){ return dayId + "#" + idx; }
function isDone(dayId, idx){ return !!doneMap[taskKey(dayId, idx)]; }
function toggleDone(dayId, idx){
  var k = taskKey(dayId, idx);
  if(doneMap[k]) delete doneMap[k];
  else doneMap[k] = true;
  saveDone();
}

var currentDayIndex = 0;
var statusFilter = "all";
var subjectFilter = "all";

/* find today's real date match, else default to first day */
(function initDay(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  var found = -1;
  for(var i=0;i<DAYS.length;i++){
    if(DAYS[i].year===y && DAYS[i].month===m && DAYS[i].date===d){ found=i; break; }
  }
  currentDayIndex = found >= 0 ? found : 0;
})();

/* ---------- HELPERS ---------- */
function nonExamTasks(day){
  return day.tasks.filter(function(t){ return t.type !== "exam"; });
}
function dayCompletion(day){
  var list = nonExamTasks(day);
  var total = list.length;
  var done = list.filter(function(t){ return isDone(day.id, t.idx); }).length;
  return {done:done, total:total};
}
function overallCompletion(){
  var total=0, done=0;
  DAYS.forEach(function(day){
    var c = dayCompletion(day);
    total += c.total; done += c.done;
  });
  return {done:done, total:total};
}
function computeStreak(){
  // count consecutive fully-completed days ending at the most recent fully completed day
  // walking backward from currentDayIndex
  var streak = 0;
  for(var i=currentDayIndex;i>=0;i--){
    var c = dayCompletion(DAYS[i]);
    if(c.total>0 && c.done===c.total) streak++;
    else break;
  }
  return streak;
}

/* ---------- RENDER ---------- */
var els = {
  prevBtn: document.getElementById("prevBtn"),
  nextBtn: document.getElementById("nextBtn"),
  dayLabel: document.getElementById("dayLabel"),
  daySub: document.getElementById("daySub"),
  todayBtn: document.getElementById("todayBtn"),
  nextUnfinishedBtn: document.getElementById("nextUnfinishedBtn"),
  dayCount: document.getElementById("dayCount"),
  dayFill: document.getElementById("dayFill"),
  overallFill: document.getElementById("overallFill"),
  streakNum: document.getElementById("streakNum"),
  examBannerHolder: document.getElementById("examBannerHolder"),
  taskList: document.getElementById("taskList"),
  statusFilters: document.getElementById("statusFilters"),
  subjectFilters: document.getElementById("subjectFilters"),
  resetBtn: document.getElementById("resetBtn")
};

function render(){
  var day = DAYS[currentDayIndex];

  els.prevBtn.disabled = currentDayIndex === 0;
  els.nextBtn.disabled = currentDayIndex === DAYS.length - 1;

  els.dayLabel.textContent = day.label.toUpperCase();
  var c = dayCompletion(day);
  els.daySub.textContent = c.total + " SESSION" + (c.total===1?"":"S") + (day.hasExam ? " · EXAM DAY" : "");
  els.dayLabel.style.color = day.hasExam ? "var(--exam)" : "var(--ink)";

  els.dayCount.innerHTML = c.done + " / " + c.total + " <span>completed</span>";
  els.dayFill.style.width = (c.total? (c.done/c.total*100):0) + "%";

  var overall = overallCompletion();
  els.overallFill.style.width = (overall.total ? (overall.done/overall.total*100) : 0) + "%";

  els.streakNum.textContent = computeStreak();

  // exam banners
  els.examBannerHolder.innerHTML = "";
  day.tasks.filter(function(t){return t.type==="exam";}).forEach(function(t){
    var parts = t.text.split(" — ");
    var title = parts[0];
    var code = parts[1] || "";
    var div = document.createElement("div");
    div.className = "exam-banner";
    div.innerHTML = '<div class="tag">EXAM DAY · ' + t.subject + '</div>' +
      '<div class="title">' + escapeHtml(title) + '</div>' +
      (code ? '<div class="code">' + escapeHtml(code) + '</div>' : '');
    els.examBannerHolder.appendChild(div);
  });

  // task list (excluding exam entries, they're shown as banners)
  var list = day.tasks.filter(function(t){ return t.type !== "exam"; });

  if(subjectFilter !== "all"){
    list = list.filter(function(t){ return t.subject === subjectFilter; });
  }
  if(statusFilter === "unfinished"){
    list = list.filter(function(t){ return !isDone(day.id, t.idx); });
  }else if(statusFilter === "completed"){
    list = list.filter(function(t){ return isDone(day.id, t.idx); });
  }

  els.taskList.innerHTML = "";
  if(list.length === 0){
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Nothing here for this filter.";
    els.taskList.appendChild(empty);
  }else{
    list.forEach(function(t){
      els.taskList.appendChild(renderTask(day, t));
    });
  }
}

function escapeHtml(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function typeLabel(type){
  if(type==="full") return "FULL PAPER";
  if(type==="mark") return "MARK + CORRECT";
  if(type==="rest") return "REST";
  return "SESSION";
}

function taskColor(t){
  return SUBJECT_COLORS[t.subject] || "#7a8fb0";
}

function renderTask(day, t){
  var done = isDone(day.id, t.idx);
  var el = document.createElement("div");
  el.className = "task type-" + t.type + (done ? " done" : "");
  var subjColor = taskColor(t);
  el.style.borderLeftColor = subjColor;
  if(done){
    el.style.background = "linear-gradient(135deg, " + hexA(subjColor,"1c") + ", var(--panel) 70%)";
    el.style.boxShadow = "0 0 0 1px " + hexA(subjColor,"3d") + ", 0 0 26px -4px " + hexA(subjColor,"70") + ", inset 0 0 18px -6px " + hexA(subjColor,"33");
  }else{
    el.style.background = "var(--panel)";
    el.style.boxShadow = "0 0 0 1px " + hexA(subjColor,"12") + ", 0 6px 16px -10px " + hexA(subjColor,"3d");
  }

  var box = document.createElement("div");
  box.className = "box";
  box.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#0b0d10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(done){
    box.style.background = subjColor;
    box.style.borderColor = subjColor;
  }

  var body = document.createElement("div");
  body.className = "task-body";

  var top = document.createElement("div");
  top.className = "task-top";
  var subjTag = "";
  if(t.subject !== "GEN" && subjColor){
    subjTag = '<span class="subj-tag" style="color:' + subjColor + ';background:' + hexA(subjColor,"26") + '">' + t.subject + '</span>';
  }
  top.innerHTML = subjTag +
    '<span class="sess-num">Session ' + (t.idx+1) + '</span>' +
    '<span class="type-tag ' + t.type + '">' + typeLabel(t.type) + '</span>';

  var txt = document.createElement("div");
  txt.className = "task-text";
  txt.textContent = t.text;

  body.appendChild(top);
  body.appendChild(txt);

  var detail = getDetail(t.text);
  if(detail){
    var det = document.createElement("div");
    det.className = "task-detail";
    det.textContent = detail;
    body.appendChild(det);
  }

  el.appendChild(box);
  el.appendChild(body);

  el.addEventListener("click", function(){
    toggleDone(day.id, t.idx);
    render();
  });

  return el;
}

/* ---------- EVENTS ---------- */
els.prevBtn.addEventListener("click", function(){
  if(currentDayIndex > 0){ currentDayIndex--; render(); }
});
els.nextBtn.addEventListener("click", function(){
  if(currentDayIndex < DAYS.length-1){ currentDayIndex++; render(); }
});
els.todayBtn.addEventListener("click", function(){
  var now = new Date();
  var y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  var found=-1;
  for(var i=0;i<DAYS.length;i++){
    if(DAYS[i].year===y && DAYS[i].month===m && DAYS[i].date===d){ found=i; break; }
  }
  currentDayIndex = found>=0 ? found : 0;
  render();
});
els.nextUnfinishedBtn.addEventListener("click", function(){
  for(var i=currentDayIndex;i<DAYS.length;i++){
    var c = dayCompletion(DAYS[i]);
    if(c.total>0 && c.done < c.total){
      currentDayIndex = i;
      render();
      return;
    }
  }
  // wrap around from start if none found forward
  for(var j=0;j<currentDayIndex;j++){
    var c2 = dayCompletion(DAYS[j]);
    if(c2.total>0 && c2.done < c2.total){
      currentDayIndex = j;
      render();
      return;
    }
  }
});

els.statusFilters.addEventListener("click", function(e){
  var btn = e.target.closest(".chip");
  if(!btn) return;
  statusFilter = btn.getAttribute("data-f");
  Array.prototype.forEach.call(els.statusFilters.children, function(c){ c.classList.toggle("active", c===btn); });
  render();
});
function paintSubjectChips(){
  Array.prototype.forEach.call(els.subjectFilters.children, function(c){
    var s = c.getAttribute("data-s");
    var isActive = (s === subjectFilter);
    c.classList.toggle("active", isActive && s === "all");
    var color = SUBJECT_COLORS[s];
    if(isActive && color){
      c.style.color = color;
      c.style.borderColor = color;
      c.style.background = hexA(color,"1f");
    }else{
      c.style.color = "";
      c.style.borderColor = "";
      c.style.background = "";
    }
  });
}
els.subjectFilters.addEventListener("click", function(e){
  var btn = e.target.closest(".schip");
  if(!btn) return;
  subjectFilter = btn.getAttribute("data-s");
  paintSubjectChips();
  render();
});
paintSubjectChips();

els.resetBtn.addEventListener("click", function(){
  if(confirm("Are you sure you want to reset all progress?")){
    doneMap = {};
    saveDone();
    render();
  }
});

render();
